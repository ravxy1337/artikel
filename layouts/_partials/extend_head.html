<script>
  // Restore saved theme BEFORE page renders to prevent flash
  (function() {
    var saved = localStorage.getItem('pref-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  })();
</script>
